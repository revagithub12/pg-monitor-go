<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pg-monitor-go</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  input, button { padding: .5rem; margin-right: .4rem; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  td, th { border-bottom: 1px solid #ccc; padding: .4rem; text-align: left; }
  #alerts li { color: #b00020; margin: .3rem 0; }
</style>
</head>
<body>
<h1>PostgreSQL Monitor</h1>
<div id="login">
  <input id="user" placeholder="username" value="admin">
  <input id="pass" type="password" placeholder="password" value="admin12345">
  <button onclick="login()">Login</button>
  <span id="msg"></span>
</div>
<table id="metrics"><tbody></tbody></table>
<h3>Live alerts</h3>
<ul id="alerts"></ul>
<script>
async function login() {
  const res = await fetch('/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: user.value, password: pass.value})
  });
  const data = await res.json();
  if (!res.ok) { msg.textContent = data.error; return; }
  msg.textContent = 'connected';
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws?token=${data.token}`);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'metrics') {
      const rows = Object.entries(m.data).map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`);
      document.querySelector('#metrics tbody').innerHTML = rows.join('');
    } else if (m.type === 'alert') {
      const li = document.createElement('li');
      li.textContent = `${m.data.time} - ${m.data.message}`;
      alerts.prepend(li);
    }
  };
  ws.onclose = () => { msg.textContent = 'disconnected'; };
}
</script>
</body>
</html>
